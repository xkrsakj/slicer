<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings</title>

    <link rel="stylesheet" href="../css/settings.css">
    <script defer src="../js/settings.js"></script>
</head>

<body>
    <div class="fields">
        <div id="origin-x-field" class="field">
            <p>origin off. X</p>
            <input type="number" value="0">
            <button disabled>test</button>
        </div>
        <div id="origin-y-field" class="field">
            <p>origin off. Y</p>
            <input type="number" value="0">
            <button disabled>test</button>
        </div>
        <div id="top-angle-field" class="field">
            <p>top pos.</p>
            <input type="number" value="130">
            <button>test</button>
        </div>
        <div id="bottom-angle-field" class="field">
            <p>bottom pos.</p>
            <input type="number" value="70">
            <button>test</button>
        </div>
        <div id="acceleration-field" class="field">
            <p>acceleration</p>
            <input type="number" value="200">
            <button disabled>test</button>
        </div>
    </div>
    <div class="btns">
        <button id="cancel-btn">Cancel</button>
        <button id="ok-btn">OK</button>
    </div>
</body>
</html>
